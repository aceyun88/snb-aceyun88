# 매일 아침 오늘의 AI 소식 10건을, 매주 월요일 아침 칼럼·기사·주간 AI 소식·기사 속 기관명을, 매달 1일 아침 저서 목록을 수집해 저장소에 갱신한다 (워크플로는 매일 돌며 날짜를 보고 건너뛴다). 홈페이지는 이 파일들을 GitHub에서 직접 읽으므로 배포가 필요 없다
name: collect-daily

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 월요일·매달 1일인지 확인
        id: day
        run: |
          echo "monday=$([ "$(TZ=Asia/Seoul date +%u)" = "1" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "first=$([ "$(TZ=Asia/Seoul date +%d)" = "01" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: 오늘의 AI 소식 10건 (매일)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/fetch-ai-daily.py || echo "ai-daily failed"
      - name: 오늘의 AI 소식 알림 — 텔레그램·이메일 (비밀값이 있을 때만)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/notify-daily.py || echo "notify failed"
      - name: 칼럼·뉴스 (매주 월요일, 수동 실행 시에도)
        if: steps.day.outputs.monday == 'yes' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch-news.py || echo "news failed"
      - name: AI 소식 (매주 월요일, 수동 실행 시에도)
        if: steps.day.outputs.monday == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/fetch-ai-news.py || echo "ai-news failed"
      - name: 저서 (매달 1일, 수동 실행 시에도)
        if: steps.day.outputs.first == 'yes' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch-books.py || echo "books failed"
      - name: 기사 속 기관명 (매주 월요일)
        if: steps.day.outputs.monday == 'yes' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch-clients.py || echo "clients failed"
      - name: 변경이 있으면 커밋
        run: |
          git config user.name "snb-collector"
          git config user.email "aceyun88@users.noreply.github.com"
          git add news.json ai-news.json ai-daily.json books.json clients.json
          git diff --cached --quiet && echo "no change" || (git commit -m "자동 수집 $(date -u +%Y-%m-%d) — 오늘의 AI 소식·칼럼·주간 AI 소식·저서" && git push)
