<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찾으시는 쪽이 없습니다 | AI융합교육전문가 윤성임</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard','Noto Sans KR',Arial,sans-serif;
  background:linear-gradient(135deg,#061b3a,#0b376d);color:#fff;line-height:1.6;
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
.box{width:min(520px,100%);text-align:center}
.num{font-size:12px;letter-spacing:.2em;color:#c9922e;font-weight:900;margin-bottom:16px}
h1{font-size:clamp(24px,5vw,34px);font-weight:900;letter-spacing:-.05em;line-height:1.3;margin-bottom:12px}
p{font-size:15px;color:#c4d6ee;margin-bottom:28px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 24px;border-radius:999px;font-weight:900;font-size:15px;text-decoration:none;
}
.gold{background:linear-gradient(135deg,#d6a042,#b77c1e);color:#fff}
.line{border:1px solid rgba(255,255,255,.4);color:#fff}
a:hover{filter:brightness(1.08)}
.foot{margin-top:30px;font-size:12.5px;color:#8fa8c8}
</style>
</head>
<body>
  <div class="box">
    <div class="num">404 NOT FOUND</div>
    <h1>찾으시는 쪽이 없습니다</h1>
    <p>주소가 바뀌었거나, 처음부터 없는 쪽입니다.</p>
    <div class="btns">
      <a class="gold" href="/">첫 화면으로</a>
      <a class="line" href="https://snb-prompt-pack.netlify.app" target="_blank" rel="noopener">무료 프롬프트 보러 가기</a>
    </div>
    <div class="foot">AI융합교육전문가 윤성임 · 소셜앤비즈</div>
  </div>
</body>
</html>
