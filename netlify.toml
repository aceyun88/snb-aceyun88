# Netlify 배포 설정. 빌드할 것이 없는 정적 사이트다.
#
# 작업 문서는 저장소에는 두되 사이트로는 내보내지 않는다.
# Netlify 리다이렉트의 별표(*)는 경로 끝에서만 듣는다. "/*.md" 같은 꼴은 안 먹으므로
# 루트에 두는 문서는 이름을 하나씩 적는다. 새 문서는 docs/ 에 넣으면 규칙을 안 고쳐도 된다.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# 보안 헤더 — 정적 사이트라 서버 공격면은 없지만, 끼워넣기(iframe)·스니핑·참조 정보 노출을 막는다
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://raw.githubusercontent.com; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://docs.google.com; object-src 'none'"

# 사진·아이콘은 한 주 동안 브라우저에 저장 — 기본값(max-age=0)은 방문할 때마다 서버에 다시 물어봐 프로필 사진이 늦게 뜬다
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 강의 홍보 페이지(events/)는 링크를 받은 사람만 본다 — 검색 색인 금지 헤더(페이지의 noindex 메타와 이중)
[[headers]]
  for = "/events/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
