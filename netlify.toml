# Netlify 배포 설정. 빌드할 것이 없는 정적 사이트다.
#
# 작업 문서는 저장소에는 두되 사이트로는 내보내지 않는다.
# Netlify 리다이렉트의 별표(*)는 경로 끝에서만 듣는다. "/*.md" 같은 꼴은 안 먹으므로
# 루트에 두는 문서는 이름을 하나씩 적는다. 새 문서는 docs/ 에 넣으면 규칙을 안 고쳐도 된다.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
